[package]
name = "gmt_dos-clients_arrow"
version = "2.3.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "GMT DOS Arrow Client"
documentation = "https://docs.rs/gmt_dos-clients_arrow"
readme = "README.md"
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
interface.workspace = true
log = { workspace = true }
apache-arrow.workspace = true
matio-rs = { workspace = true, optional = true }
parquet.workspace = true
paste = "1.0.15"
thiserror.workspace = true
regex = "1.12.3"
gmt_dos-actors_flowchart = { version = "0.2", path = "../../actors/flowchart", default-features = false, optional = true }

[features]
# streams the logged data into the flowchart page while the model runs (gmt_dos-actors/flowchart-live)
flowchart-live = ["gmt_dos-actors_flowchart/live"]

[dev-dependencies]
env_logger.workspace = true
gmt_dos-actors.workspace = true
gmt_dos-clients.workspace = true
