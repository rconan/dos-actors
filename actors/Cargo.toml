[package]
name = "gmt_dos-actors"
version = "12.1.0"
authors = ["Rod Conan <rconan@gmto.org>"]
edition = "2021"
license = "MIT"
description = "Giant Magellan Telescope Dynamic Optical Simulation Actor Model"
repository = "https://github.com/rconan/dos-actors"
documentation = "https://docs.rs/gmt_dos-actors"
readme = "README.md"
categories = ["science", "simulation"]
keywords = ["telescope", "astronomy"]

[dependencies]
flume = "0.12.0"
futures = "0.3.32"
thiserror.workspace = true
async-trait = "0.1.89"
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "rt",
    "time",
] }
humantime = "2.3.0"
chrono = "0.4.44"
log = { workspace = true, features = ["release_max_level_info"] }
vec_box = "1.0.0"
interface.workspace = true
gmt_dos-actors_dsl = { version = "2.2", path = "dsl" }
anyhow.workspace = true
serde = { workspace = true, optional = true }
svg = "0.18.0"
html-escape = "0.2.13"
open = "5.3.4"

[features]
sampler = []
feedback = []
dta = []
noise = []
filing = ["serde", "interface/filing"]

[dev-dependencies]
rand = "0.10.1"
rand_distr = "0.6.0"
tokio-test.workspace = true
env_logger.workspace = true
complot = "0.3.5"
anyhow.workspace = true
gmt_dos-clients = { workspace = true, features = ["nalgebra","noise"] }
serde-pickle = "1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
  
[package.metadata.docs.rs]
features = ["filing"]
