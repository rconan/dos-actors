[package]
name = "gmt_dos-actors_flowchart"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "GMT DOS Actors model flowcharts"
documentation = "https://docs.rs/gmt_dos-actors_flowchart"
readme = "README.md"
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
thiserror.workspace = true
log.workspace = true
svg = { version = "0.18.0", optional = true }
html-escape = { version = "0.2.13", optional = true }
serde_json = { version = "1.0", optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = ["graphviz"]
graphviz = ["dep:svg", "dep:html-escape"]
elk = ["dep:serde_json", "dep:base64"]
